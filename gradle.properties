# Gradle daemon
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.parallel=false
# Kotlin
kotlin.code.style=official
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 built-in Kotlin is disabled because the Binary Compatibility Validator (API dump, 13 §3)
# only hooks into the standalone org.jetbrains.kotlin.android plugin. See build-logic AndroidLibraryConventionPlugin.
android.builtInKotlin=false
android.newDsl=false
