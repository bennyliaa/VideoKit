name: videokit_flutter
description: VideoKit Flutter plugin (app-facing package of the federated plugin). Implements videokit_api over the native Kit (14 §8.5).
version: 1.0.0-dev.1
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.5 <3.14.0"
  flutter: ">=3.47.7 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  videokit_api: 1.0.0-dev.1
  videokit_flutter_android: 1.0.0-dev.1
  videokit_flutter_platform_interface: 1.0.0-dev.1

dev_dependencies:
  fake_async: 1.3.3
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: videokit_flutter_android
