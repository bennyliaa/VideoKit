name: videokit_example
description: VideoKit Flutter example app (M0-B1 theme gallery). Demo data only.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.13.5 <3.14.0"
  flutter: ">=3.47.7 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  videokit_api: 1.0.0-dev.1
  videokit_fake: 1.0.0-dev.1
  videokit_ui: 1.0.0-dev.1

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
