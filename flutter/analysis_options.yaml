# Shared analysis rules for every VideoKit Flutter package (14 §11.3, 13 §2.1).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true
  exclude:
    - "**/*.g.dart"
    - "**/src/l10n/gen/**"
    - "**/lib/l10n/gen/**"
  errors:
    missing_return: error
    must_be_immutable: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
