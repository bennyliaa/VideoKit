# VideoKit version catalog. Every version is exact; dynamic versions and snapshots are forbidden (13 §2).
[versions]
# Build toolchain
agp = "9.4.1"
kotlin = "2.4.21"
binaryCompatibilityValidator = "0.18.2"
ktlint = "1.8.0"
# Android SDK levels (13 §2): compileSdk/targetSdk = newest stable SDK installed when the project was initialised.
androidCompileSdk = "37"
androidCompileSdkMinor = "2"
androidTargetSdk = "37"
androidMinSdk = "31"
# Runtime libraries
kotlinxCoroutines = "1.11.0"
# AndroidX Media3 (15 §1.6: latest stable at M1 initialisation, Apache-2.0)
media3 = "1.11.1"
# Test-only libraries
junit = "4.13.2"
# Flutter engine embedding (compile-time only, for the plugin check module); must match bin/internal/engine.version of the pinned Flutter SDK (3.47.7).
flutterEngine = "1.0.0-deb287481e3ce9468f3434937ced4240a70539ca"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
# M6-B1 export worker (Apache-2.0, same Media3 version).
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-muxer = { module = "androidx.media3:media3-muxer", version.ref = "media3" }
media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
flutter-embedding-debug = { module = "io.flutter:flutter_embedding_debug", version.ref = "flutterEngine" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

# Gradle plugins used by build-logic convention plugins
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
binary-compatibility-validator = { module = "org.jetbrains.kotlinx:binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
